<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fil-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trợ lý Fil — Tra cứu y khoa</title>

    <script>
      (function () {
        try {
          // Cùng khoá với useSettings: mặc định sáng, chỉ tối khi bác sĩ tự chọn.
          var a = localStorage.getItem('set_appearance_v2') || 'light';
          if (a === 'dark' || (a === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* Chế độ riêng tư chặn localStorage — cứ để nền sáng, không chặn khởi động. */
        }
      })();
    </script>

    <link rel="stylesheet" href="/fil-boot.css" />
    <noscript><style>.boot-track, .boot-status { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root" inert></div>
    <div id="boot">
      <div class="boot-field" aria-hidden="true">
        <i class="boot-star"></i><i class="boot-star"></i><i class="boot-star"></i>
        <i class="boot-star"></i><i class="boot-star"></i><i class="boot-star"></i>
      </div>
      <div class="boot-main">
        <div class="boot-orbit" aria-hidden="true">
          <span class="boot-ring"></span>
          <img class="boot-assistant" src="/fil-assistant.svg" width="360" height="360" alt="" />
        </div>
        <p class="boot-brand">Trợ lý Fil</p>
        <p class="boot-subtitle">Không gian làm việc y khoa</p>
        <div class="boot-track" aria-hidden="true"><div class="boot-bar"></div></div>
        <p class="boot-status" id="boot-status" role="status">Đang tải giao diện…</p>
        <button class="boot-retry" id="boot-retry" type="button" hidden>Tải lại trang</button>
        <noscript><p>Hãy bật JavaScript trong trình duyệt để mở Fil.</p></noscript>
      </div>
      <footer class="boot-footer">Tra cứu thuốc · Hỏi đáp y khoa · Hỗ trợ chẩn đoán</footer>
    </div>

    <script>
      (function () {
        var status = document.getElementById('boot-status');
        var retry = document.getElementById('boot-retry');
        var timer = setTimeout(function () {
          status.textContent = 'Fil đang mất nhiều thời gian hơn bình thường để mở.';
          retry.hidden = false;
        }, 10000);
        retry.addEventListener('click', function () { window.location.reload(); });
        window.__bootPhase = function (message) {
          if (retry.hidden) status.textContent = message;
        };
        window.__bootDone = function () {
          clearTimeout(timer);
          document.getElementById('boot')?.remove();
          document.getElementById('root')?.removeAttribute('inert');
          delete window.__bootPhase;
          delete window.__bootDone;
        };
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
